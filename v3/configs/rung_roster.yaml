    blocked_by: EVAL-LOCK-CYCLE3.json, as for Rung 5.
    amended: >-
      2026-09-02, T-0125. planned -> built; adopted null -> false. The `citation` and
      `contradicts` blocks above are left exactly as written. What changed is only that the
      rung now exists and has been measured: src/rakshak/models/rung8_tpp.py fits
      lambda(t) = mu*s(t) + sum alpha*beta*exp(-beta(t-t_i)) per merchant by scipy
      L-BFGS-B with an analytic gradient, and scripts/rung8_score.py feeds the compensator
      increments to the already-locked eval.metrics.tpp_rescaled_ks. Nothing in
      EVAL_MODULES was touched; the test split was not opened and open_count is 0.
      `built` and not `scored` because the rung has no ladder row by construction — see the
      comment on `status`.
    result: >-
      Acceptance criterion 1 MET: on a Hawkes process simulated from the generator's own
      branching construction (mu 20/day, alpha 0.30, beta 480/day, 120 days, 3,671 events)
      the fit recovers 20.76 / 0.321 / 480.1 and the rescaling test does not reject —
      KS 0.0106, p 0.799, n 3,670. Paired power check: a doubled rate gives KS 0.1523,
      p 3.7e-136. Criterion 2 NOT MET, and it is the one that decides the rung. On the
      prevalence=0 population with confounders on — gates_report.scenario(prevalence=0.0),
      seed GATE_SEED+1, the same configuration and seed G5's null_data fixture uses —
      1,191 merchants over 365 days, the alert rate inside the P1 festival window at days
      308-313 is 0.0711 against a nominal 0.0050, an excess of +6.61pp against G5's own
      +2pp headroom. RED. Every alert there is a false positive by construction, so the
      statistic is firing on the PLATFORM and not on the merchant. Criterion 3 NOT MET:
      BAF is not vendored on this machine (CC BY-NC-SA; four gates already SKIP for the
      same reason), so test-size calibration against the external anchor was not measured
      and is recorded as unmet rather than waived.
    known_issue: >-
      The number that settles it is the calibrated threshold, not the excess. To hold the
      false-alarm rate at the nominal 0.0050 on a population containing NO FRAUD AT ALL,
      the test has to be thresholded at p < 1.09e-92. On the real cycle-4 validation fold
      it rejects 83.65% of merchants that never drifted at a nominal level of 0.05 — 16.7x
      its own nominal size. The cause is structural and is in the model by construction:
      the generator draws each day's COUNT from a negative binomial (median realised
      baseline Fano 8.71) and a conditional intensity cannot represent an i.i.d. latent
      per-day multiplier, because that multiplier carries no history. Re-fitting the
      baseline on days 210-239 instead of 0-29 moves the size only 0.8365 -> 0.7942, so
      elapsed non-stationarity accounts for about 4pp of a 79pp gap and the remainder is
      the NB layer. P6 (macro sinusoid, days 11-34) could not be measured at all: it
      overlaps the fit's own baseline window, so 5 of 6 confounders were evaluated and the
      sixth contaminates the baseline. NOT TUNED to rescue any of this.
    note: >-
      Reported as a METHOD DEMONSTRATION with an explicitly UNPROVEN detection claim, which
      is the third mitigation #59 pre-committed to for exactly this outcome. LIMITATIONS.md
      §12 records the circularity in the same words v1's ADR-0002 used against GNNs. The
      statistic does carry signal — ROC-AUC 0.8014 of -log10(p) against the drift label on
      586 VAL merchants — but a ranking is not what this rung was for: every other rung
      already produces a ranking, and the only thing Rung 8 offered that they do not is a
      calibrated null. That is the thing that does not survive measurement.

