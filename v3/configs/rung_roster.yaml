  standing_contradiction: >-
    CLOSED 2026-09-02 (cycle 4). It read: 00-charter-v2.md §8, 06-requirements-v2.md §E and
    STATE.md all still said Rungs 5-8 must not be started, while GitHub #51 (2026-08-31)
