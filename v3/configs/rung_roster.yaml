      Its own diagnostic flagged this before it was scored, and the result is consistent
      with it. The Page recursion assumes mean-zero
      increments under the null, but a merchant's cross-sectional RANK is persistent: a
      consistently high-risk merchant sits near the top of its cohort every day and the
      accumulator ramps without anything having changed. A smoke run put 15.4% of
