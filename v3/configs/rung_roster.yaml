  - rung: 8
    name: tpp_neural_intensity
    title: Neural conditional intensity for Rung 8
    status: built
    # `built` and NOT `scored`, for the same reason the tpp_hawkes_nb entry above says so:
    # this is a goodness-of-fit hypothesis test with no PR-AUC, no savings, no precision@K
    # and no capacity K. Its artefacts live at data/v2/rung8b_neural/ and deliberately NOT
    # at data/v2/eval/, which artifacts/build.py::read_result_rows globs into ladder.json.
    adopted: false
    module: src/rakshak/models/rung8b_neural.py
    ticket: T-0132
    issue: 66
    citation:
      - 'GitHub #66, OPEN, label `conditional`, title "(needs ADR-V3-001 reversed)"'
      - 'GitHub #51 ("A neural intensity is the upgrade and it requires the torch decision")'
    reason: Same autograd/torch gate as T-0131. Explicitly banned by 06-requirements-v2.md §E while the ADR stands.
    decided_in: GitHub #51, ADR-V3-001 (recommendation, no).
    gap: >-
      RESOLVED 2026-09-02: `docs/adr/ADR-V3-001-no-autograd.md`. Same gate as T-0131.
    amended: >-
      2026-09-02, T-0132. STATUS conditional -> built; ADOPTION null -> false. The `reason`
      and `decided_in` blocks above are left exactly as written: #51's recommendation
      against the torch reversal was never withdrawn, it was overridden by the lead, and
      rewriting the record would hide that. What moved is only the blocker. ADR-V3-001 was
      REVERSED by written amendment on 2026-09-02 for this rung and T-0131,
      `torch==2.14.0+cpu` is pinned from an explicit CPU index, and the rung was built and
      measured. `src/rakshak/models/rung8b_neural.py` is a monotone cumulative-hazard
      network (Omi, Ueda & Aihara, NeurIPS 2019) over a six-timescale closed-form
      excitation memory, with the intensity obtained as `dLambda/dtau` by `torch.autograd`;
      `scripts/rung8b_score.py` feeds its compensator increments to the already-locked
      `eval.metrics.tpp_rescaled_ks` through the SAME `compensator_increments` contract
      Rung 8 uses, and imports Rung 8's runner for the scenario, the VAL fold and the
      alert-rate arithmetic so the two columns cannot drift apart. `rung8_tpp.py` is
      UNTOUCHED. Nothing in EVAL_MODULES was touched; the test split was not opened and
      open_count is 0.
    result: >-
      NOT ADOPTED, and the adoption gate was UNREACHABLE BY CONSTRUCTION before the first
      line was written. ADR-V3-001 §AMENDMENT requires all three of T-0125's circularity
      mitigations to pass with the neural intensity AND demonstrably better goodness-of-fit
      calibration on the same KS framing. **Mitigation 2 is structurally unavailable to any
      implementation** — BAF is CC BY-NC-SA and deliberately not vendored, which is why
      `make gates` reports 4 skips — so it is recorded UNMET, exactly as Rung 8 recorded it,
      and no substitute anchor was invented. Measured, each against the parametric rung on
      identical framing: acceptance criterion 1 MET but calibration WORSE — on the same
      simulated Hawkes (same seed, same construction, 3,671 events) KS 0.0203 / p 0.0948
      against the parametric KS 0.0106 / p 0.799, so #66's criterion 4 FAILS at the
      declared epoch budget. Mitigation 1 still RED: worst window +3.78pp against G5's
      +2pp allowance (parametric +6.61pp), in the same P1 festival window, days 308-313,
      on the same fraud-free population. Validation-fold realised size 0.6958 against the
      parametric 0.8365 on the identical 586 merchants — better, and still **13.9x its own
      nominal 0.05**. 209 parameters against 3, and against the ~234 trainable positives
      ADR-V3-001 records as an unmet precondition. LIMITATIONS.md 15.
    known_issue: >-
      The number #66 predicted would move the wrong way did. LIMITATIONS.md §12.3 names the
      threshold, not the excess, as the number that settles this rung: to hold the nominal
      0.0050 alert rate on a population with NO FRAUD IN IT, the parametric test had to be
      thresholded at p < 1.09e-92. The neural test needs **p < 9.32e-111** — eighteen orders
      of magnitude further from a usable level. The added capacity fits the merchant's own
      baseline more tightly, so quiet-day p-values collapse further, which is the
      circularity objection getting worse rather than better exactly as the ticket said it
      would. A convergence diagnostic makes the mechanism explicit: at 3x the declared
      epoch budget the neural fit scores KS 0.0076 / p 0.982 on the simulated process,
      **better than the correctly-specified parametric model that generated it**. The same
      diagnostic on the validation fold settles what the one apparent gain was worth: at 3x
      the budget the realised size does not fall further, it RISES from 0.6958 to 0.7586,
      back toward the parametric 0.8365, while power rises 0.9500 -> 0.9833. Training the
      intensity harder fits each merchant own baseline more tightly and rejects MORE
      merchants that never drifted, so the 14pp size advantage at the declared budget is
      substantially the slack of a fit stopped short of its optimum rather than better
      calibration. NOT TUNED to rescue any of this — the optimiser settings were fixed in
      the module before the first mitigation ran, no configuration was re-chosen after a
      result was seen, and both longer-budget runs make the rung look worse, not better.
