    - project-context/STATE.md — "Deferred (do not start)"
    - docs/PRE-REGISTRATION-CYCLE3-2026-08-31.md §3, §4
    - 'GitHub #51 — SPEC: the five deferred capabilities'
    - GitHub issue list, `gh issue list --state all --limit 80`
  known_gap: >-
    CLOSED 2026-09-02 (cycle 4). ADR-V3-001 (the torch decision) gates the two `conditional`
    entries below. It was referenced by GitHub #51 as "ADR-V3-001 below records it" while
    `grep -rn ADR-V3-001` over this tree returned nothing, so the two entries rested on
