# Rung roster — every rung on the ladder, named with its status (T-0130, GitHub #64)
#
# WHY THIS FILE EXISTS. `artifacts/ladder.json` is built from `data/v2/eval/*.json`, so it
# can only contain rungs that were scored. A rung that was cut, or deferred, or never
# started, is therefore INVISIBLE to it — not shown as cut, simply absent. #64 asks for the
# opposite: a cut rung named as cut. There was no machine-readable source for that, so this
# file is it, and the emitter reads it into the `rung_roster` artefact.
#
# THIS IS A DRAFT FOR THE LEAD TO CORRECT, NOT AN ASSERTION OF FACT. It was derived from
# committed documents by an agent, and every entry carries the citation it was derived from
# so the derivation can be checked rather than trusted. Where the documents disagree or say
# nothing, the entry is `status: UNVERIFIED` with the disagreement written out. A roster
# that is confidently wrong is worse than one that flags its own gaps, because this gets
# rendered to judges as project state.
#
# NO SCORES LIVE HERE, BY CONSTRUCTION. Scores live in `artifacts/ladder.json`, keyed by the
# same `rung` id. Rungs 5-8 have no numbers, and the roster says they were not scored rather
# than carrying nulls that render as zeroes. `artifacts.validate` refuses a roster entry
# carrying a `metrics` key for exactly this reason.
#
# `adopted` is Prime Directive 5's question and is separate from `status`. A rung can be
# scored and not adopted (Rung 3), or scored and then cut (Rung 4). `null` means the
# question has not been put.

schema: rung_roster/v1

# The set the emitter and the contract validate against. UNVERIFIED is uppercase so it is
# impossible to skim past.
statuses:
  - planned  # ticket exists, not started
  - built  # code in the tree, no EvalResult row of its own
  - scored  # has rows under data/v2/eval/, therefore appears in ladder.json
  - cut  # was live at some point, then dropped, with a reason and a decision site
  - deferred  # explicitly out of scope, with a reason and a decision site
  - conditional  # gated on a decision that has not been made
  - UNVERIFIED  # the documents disagree or are silent — DO NOT render as fact

