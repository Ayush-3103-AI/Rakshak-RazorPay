# Rakshak v2 — the scenario manifest.
#
# This file is the whole parameter surface of the generator. `src/rakshak/generator/`
# contains no numeric literal that is not a loop index or a mathematical constant; every
# behavioural number is here, named and commented, and `config.py` requires all of them
# (there are no defaults — a default is a magic number with a nicer name).
#
# The file is hashed into EVAL-LOCK.json, so a change here after the freeze is visible.
#
# Spec: project-context/08-generator-v2-spec.md §8.
# Confirmed scenario parameters: charter §10, settled 2026-08-31.

seed: 42

population:
  # T-0101 corrected geometry (GitHub #34), pre-registered in
  # docs/RE-FREEZE-2026-08-31.md Amendment 4 BEFORE this file was edited. 20,000
  # merchants over 365 days, onsets confined to days 30-240, is what
  # tests/unit/test_config.py::test_test_split_has_enough_labelled_positives_per_seed
  # measures as sufficient (59-86 labelled positives per seed in the test split,
  # against a >=50 floor) — a 10,000 x 360 draft measures 16-29 per seed, RED.
  n_merchants: 20000
  n_days: 365
  # Drift onsets are confined to this window for EVERY typology. Each typology's
  # onset_day_min/max below is scaled into [onset_window_min_day, onset_window_max_day]
  # preserving its ORIGINAL relative position and spread, so none is made easier or
  # harder relative to another. R2/R7/R9 anchor the lower edge (30); R6 anchors the
  # upper edge (240). Enforced in generator/config.py::ScenarioConfig.__post_init__.
  onset_window_min_day: 30
  onset_window_max_day: 240
  prevalence: 0.0147            # BAF-native. AP-06: NEVER evaluate at 0.20.
  start_date: "2026-01-01"      # simulation day 0, UTC midnight
  onboarding_spread_days: 120   # merchants onboarded 0-120 days before day 0
  declaration_error_sigma: 0.55 # lognormal spread of declared vs actual monthly GMV.
                                # At 0, v_declared_ratio is a constant and F1 loses a
                                # feature; the gap is the whole point of the signal.
  max_vintage_months: 96        # business age at onboarding, uniform on [0, 96)

# T-0101 corrected split geometry (GitHub #34), pre-registered in
# docs/RE-FREEZE-2026-08-31.md Amendment 4. Two INDEPENDENT facts:
#   - DAY boundaries (240/60/65 days -- 65.75%/16.44%/17.81% of the horizon), read by
#     cli.py and passed to the UNMODIFIED eval.splits.SplitBoundaries constructor.
#   - the MERCHANT-level fold split (60%/15%/25%), assigned by a new, sibling
#     function in cli.py -- NOT eval.splits.merchant_fold(), which stays untouched so
#     eval_module_sha256 stays byte-identical (RE-FREEZE.md Amendment 4).
splits:
  train_end_day: 239             # days 0-239
  val_end_day: 299                # days 240-299
  test_end_day: 364               # days 300-364 == population.n_days - 1
  merchant_fold_train: 0.60
  merchant_fold_val: 0.15
  merchant_fold_test: 0.25

arrivals:
  target_fano: 12.25            # measured in v1; Poisson is 1.0. G1 calibrates on this.
  hawkes_excitation: 0.35       # branching ratio; only active for bursty typologies (R3)
  hawkes_decay_minutes: 3.0     # exponential kernel time constant
  hawkes_window_minutes: 10.0   # spec §1: "raises the intensity for the next 10 minutes"
  hawkes_max_children: 40       # hard cap per parent; a mis-set excitation fails, not hangs
  # Monday-first. Indian retail dips midweek and peaks Fri-Sun.
  dow_factors: [0.95, 0.92, 0.94, 1.00, 1.12, 1.15, 0.92]

