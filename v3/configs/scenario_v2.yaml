# ─────────────────────────────────────────────────────────────────────────────
# Platform confounders P1-P6 — the v2 contribution (spec §4).
#
# MAGNITUDES ARE IN SIGMA UNITS. The spec's own table states effects as "up 2-4σ", and
# T-114's Done-when asks for population mean |z| > 1.0 inside every window. A relative
# multiplier cannot satisfy that at Fano 12.25: a merchant's own daily-count sd is
# sqrt(fano * lambda), so +15% on lambda=22 is |z| ~ 0.2. Each magnitude below is
# therefore converted per merchant to 1 + magnitude_sigma * sqrt(target_fano / lambda).
# ─────────────────────────────────────────────────────────────────────────────
confounders:
  enabled: true

  # P1 must hit L2 (seasonal D2C) harder than L4 (lumpy B2B), or the cohort residual has
  # an unfairly easy job and G5 passes for the wrong reason (spec §4).
  persona_sensitivity:
    L1: 1.00
    L2: 1.70
    L3: 1.25
    L4: 0.45
    L5: 0.55                    # subscriptions do not care that it is Diwali
    L6: 1.35
    L7: 0.85
    L8: 1.55

  P1_festival:                  # 5-day bump on volume for everyone
    count: 2
    magnitude_sigma: 3.5        # spec band is 2-4 sigma; 3.0 left the second window at
                                # |z| = 1.02 against a gate floor of 1.0, which is a pass
                                # that would flip on the next seed
    duration_days: 5            # a DURATION — does not scale with the window (amendment 2)
    days: [93, 308]              # T-0101: day INDICES rescaled x365/180 from [46,152] —
                                # amendment 2's rule. 93 lands in train, 308 in test.

  P2_outage:                    # auth failures up, count down, for a few hours
    count: 3
    magnitude_sigma: 4.0
    duration_hours: 6           # a DURATION — does not scale
    intensity_multiple: 0.35    # volume that does not arrive during an outage
    days: [57, 197, 290]         # T-0101: rescaled x365/180 from [28,97,143]. 57,197
                                # land in train, 290 in val.

  P3_fee_change:                # permanent step toward the cheaper rail
    day: 122                    # T-0101: rescaled x365/180 from 60. Lands in train.
    magnitude_sigma: 2.5
    target_instrument: upi
    window_days: 14             # long enough for the 7d rolling mix feature to register

  P4_new_method:                # a new instrument gains share on an S-curve
    day: 182                    # T-0101: rescaled x365/180 from 90. Lands in train.
    ramp_days: 30                # a DURATION — does not scale
    magnitude_sigma: 3.0
    target_instrument: wallet

  P5_regulatory:                # tokenisation: CNP/BIN step + a transient failure bump
    day: 243                    # T-0101: rescaled x365/180 from 120. Lands in val.
    transient_days: 10           # a DURATION — does not scale
    magnitude_sigma: 3.0

  P6_macro:                     # always-on sinusoid
    amplitude_sigma: 1.2
    period_days: 90
    peak_window_divisor: 8.0    # gate window is peak +/- period/8 days

# ─────────────────────────────────────────────────────────────────────────────
labels:
  dispute_delay_days: [45.0, 120.0]   # Uniform, label_event_at -> label_available_at
  fraud_to_dispute_mean_days: 21.0    # Exponential, drift_onset_at -> label_event_at
  unreported_rate: 0.15               # fraud that is never disputed: label=0, not censored
  spurious_chargeback_rate: 0.003     # label=1 on a merchant that did nothing wrong

settlement:
  cycle_days: 2                 # T+2
  min_payout_inr: 500.0         # below this a merchant does not bother
  accelerated_prob_per_urgency: 0.30

capacity:
  analyst_reviews_per_day: 50   # K. Charter §10.4 — load-bearing.
  per_n_merchants: 10000

costs:
  # v1 measured this asymmetry at 47.5 / 13.1 / 61368 against a literature band of
  # 400-600 — three orders of magnitude. Treat these as SWEPT, not as constants.
  fraud_loss_multiplier: 1.0
  false_hold_cost_inr: 8000.0
  review_cost_inr: 250.0
  min_true_loss_inr: 1.0        # floor; GroundTruth requires a strictly positive loss
  # Probability an analyst review actually stops the fraud. Used by the section 2 cost
  # matrix: REVIEW on a fraud costs review_cost + (1 - p_catch) * loss. It was referenced
  # by the matrix but never declared here, so it lived as a CostParams default in code -
  # a magic number by another name. Landing it changes no result: the value IS the default.
  p_catch: 0.80

# Where PASS/REVIEW/HOLD is drawn. 10-eval-harness-spec.md section 4 says both thresholds
# live in config; they were ActionPolicy defaults in eval/capacity.py until now. Same
# story as p_catch above, and the same values, so no number moves.
decision:
  hold_score_threshold: 0.90              # calibrated probability
  hold_expected_loss_floor_inr: 25000.0   # score * exposure, in rupees

# Per-transaction mark constants. Trivia until one of them is wrong: a single-entry
# decline_codes list makes f_decline_entropy identically zero for the whole population
# and nothing fails.
marks:
  round_amount_values: [100.0, 500.0, 1000.0, 5000.0]   # t_round_amount_share reads these
  micro_amount_max: 10.0        # t_micro_share is defined as the share of txns <= Rs 10
  bin_pool_global: 3000         # issuer BINs a legitimate card book spreads over
  device_pool_per_merchant: 900
  ip_pool_per_merchant: 1400
  decline_codes: ["do_not_honour", "insufficient_funds", "invalid_cvv", "expired_card",
                  "issuer_unavailable", "risk_declined", "invalid_card", "limit_exceeded"]
  pending_rate: 0.006
  refund_min_fraction: 0.5      # a refund is Uniform(0.5, 1.0) x the original, never more
  payer_id_space: 2000000000    # ids above this are freshly minted payers
  ring_count: 6                 # R7 mule rings
  ring_payer_pool: 900          # shared across a ring: individually unremarkable,
  ring_device_pool: 220         # jointly the only thing that makes R7 detectable
  regular_jitter_seconds: 150.0 # jitter on L5's evenly spaced arrivals

# MCC codes per group. A merchant's declared MCC is drawn from its group; R4 and R9
# drift the per-transaction MCC out of the group, which is what f_mcc features see.
mcc_groups:
  retail:       ["5411", "5499", "5912", "5921"]
  electronics:  ["5732", "5734", "5722"]
  apparel:      ["5651", "5691", "5661"]
  services:     ["7299", "7392", "7399"]
  travel:       ["4722", "4511", "7011"]
  b2b:          ["5045", "5085", "5065"]
  digital:      ["5815", "5817", "5818"]
  restricted:   ["7995", "6051", "5967", "5122"]   # the categories R9 drifts toward

# The group no merchant may declare, and the one R4/R9 drift into. Named explicitly so
# that renaming a group cannot silently make it declarable.
mcc_drift_group: restricted
