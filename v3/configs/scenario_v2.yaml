# ─────────────────────────────────────────────────────────────────────────────
# Risk typologies R1-R9. `mix` values must sum to 1.0 and weight the easy typologies
# down, so the positive class is not dominated by the easiest case (spec §3).
# Day indices are simulation days; onset is drawn uniformly in [onset_day_min, max].
# ─────────────────────────────────────────────────────────────────────────────
typologies:

  R1:   # Classic bust-out. Convex ramp, payout urgency, then vanish. Easy.
    mix: 0.20
    onset_day_min: 59
    onset_day_max: 189
    ramp_days_min: 14
    ramp_days_max: 21
    intensity_multiple: 14.0
    convexity: 5.0              # strongly convex — this is what L3's linear ramp is not.
                                # Calibrated: a linear fit to the cohort-mean R1 ramp must
                                # land under R^2 0.7 while L3's lands over 0.9 (T-112).
    vanish_after_ramp: true
    vanish_intensity: 0.02        # the bust: 2% of base once the ramp completes
    amount_mu_shift: 0.45
    amount_sigma_shift: 0.20
    fail_rate_add: 0.03
    intl_share_add: 0.04
    cnp_share_add: 0.08
    refund_rate_add: 0.0
    micro_share: 0.0
    round_amount_share: 0.10
    payer_concentration: 0.35   # a fabricated payer base repeats more than a real one
    new_payer_rate_add: 0.20
    bin_pool: 120
    hawkes: false
    hour_flip: false
    mcc_drift: 0.0
    payout_urgency: 3.5
    ring: false
    loss_fraction: 0.75

  R2:   # SLOW-RAMP bust-out. 60-90 day ramp; each week's change < 1 sigma of its own
        # baseline. This is the one v1 failed on, and it stays in the population so the
        # failure is visible and attributed rather than averaged away.
    mix: 0.20
    onset_day_min: 30
    onset_day_max: 131
    ramp_days_min: 60
    ramp_days_max: 90
    intensity_multiple: 3.2     # deliberately modest: a big multiple over 60 days is
                                # still a large weekly step, and R2 must not have one
    convexity: 1.15
    vanish_after_ramp: false
    vanish_intensity: 1.0         # ignored (vanish_after_ramp is false); stated so it is auditable
    amount_mu_shift: 0.30
    amount_sigma_shift: 0.10
    fail_rate_add: 0.01
    intl_share_add: 0.02
    cnp_share_add: 0.04
    refund_rate_add: 0.0
    micro_share: 0.0
    round_amount_share: 0.04
    payer_concentration: 0.20
    new_payer_rate_add: 0.10
    bin_pool: 200
    hawkes: false
    hour_flip: false
    mcc_drift: 0.0
    payout_urgency: 1.8
    ring: false
    loss_fraction: 0.60

  R3:   # Card-testing host. Micro-amount bursts, high auth-fail, concentrated BINs,
        # Hawkes self-excitation. Without the excitation, f_retry_burst_rate is noise.
    mix: 0.15
    onset_day_min: 44
