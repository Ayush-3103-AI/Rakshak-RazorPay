[project]
name = "rakshak"
version = "0.1.0"
description = "Rakshak — post-onboarding merchant risk sentinel (Razorpay AI Buildathon 2026, Track 02)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    # T-0021: unpinned upper bound let a clean checkout install pandas 3.x, whose
    # `future.infer_string` default silently upcasts object-dtype string columns
    # (merchant_id, payer_id, mcc, method — see generator/generate.py) to the new
    # StringDtype. Same values, different dtype metadata: it broke
    # test_transaction_schema and is exactly the kind of environment drift that
    # would put the "results/ are byte-identical at seed 42" claim at risk without
    # ever changing a number anyone would notice. Pin to the major version this
    # was built and the committed results/ were generated against.
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "scipy>=1.11",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    # T-0020: pymoo>=0.6.2 removed 2026-08-30. It was declared for T-0009 (NSGA-II
    # frontier), which was cut on 2026-08-28. Nothing imports it. Do not re-add it
    # without the grid-search ablation ADR-0004 makes mandatory.
    "matplotlib>=3.8",
    # T-0015: UCI ships Online Retail II as .xlsx only. openpyxl is MIT —
    # compatible with the permissive-licence-only constraint in CLAUDE.md.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Anchored to the repo root with a leading slash. Unanchored, "data" also matched
# src/rakshak/data/, silently excluding that whole package from linting (found 2026-08-29).
extend-exclude = ["/results", "/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# profile.py embeds the dataset survey as a markdown table. Markdown table rows are one
# row per line by definition and cannot be wrapped without breaking the table. E501 is
# waived for this file only, for that constant only in practice.
# Upgrade path: move SURVEY_MARKDOWN into its own .md and read it, which also halves the
# module (the 2026-08-29 standards review flagged it as ~60% embedded markdown).
"src/rakshak/data/profile.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rakshak"]
